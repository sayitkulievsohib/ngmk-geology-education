<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>
  </defs>
  <!-- Outer Circular Border -->
  <circle cx="100" cy="100" r="96" fill="url(#darkGrad)" stroke="url(#yellowGrad)" stroke-width="5"/>
  <circle cx="100" cy="100" r="86" fill="none" stroke="#27272A" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Mining Pickaxes Symbol -->
  <g transform="translate(100, 92)">
    <!-- Pickaxe 1 -->
    <path d="M-38 -24 C-20 -38 20 -38 38 -24 C28 -28 -28 -28 -38 -24 Z" fill="#FACC15"/>
    <rect x="-3" y="-20" width="6" height="52" rx="2" fill="#E4E4E7" transform="rotate(-35)"/>
    <rect x="-3" y="-20" width="6" height="52" rx="2" fill="#E4E4E7" transform="rotate(35)"/>
    <!-- Center Mining Diamond / Mineral Core -->
    <polygon points="0,-16 14,-2 0,12 -14,-2" fill="#FACC15" stroke="#18181B" stroke-width="1.5"/>
  </g>

  <!-- Bottom Crest Banner text -->
  <path d="M 35 155 Q 100 178 165 155" fill="none" stroke="#FACC15" stroke-width="1.5"/>
  <text x="100" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">
    KONCHILIK
  </text>
  <text x="100" y="162" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="600" fill="#FACC15" text-anchor="middle" letter-spacing="1.5">
    O'QUV MARKAZI
  </text>
</svg>
